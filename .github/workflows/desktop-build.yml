# GitHub Actions CI Workflow for Building PureCloud Desktop Client (Tauri 2.0)
# Location: .github/workflows/desktop-build.yml

name: Build PureCloud Desktop Client (Tauri 2.0)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri Desktop Client
        working-directory: ./desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload Artifacts (Download direkt auf GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: PureCloud-Desktop-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            desktop/src-tauri/target/**/bundle/deb/*.deb
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/nsis/*.exe
            desktop/src-tauri/target/**/bundle/dmg/*.dmg

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/**/bundle/deb/*.deb
            desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/bundle/msi/*.msi
            desktop/src-tauri/target/**/bundle/nsis/*.exe
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
